<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bg)"/>

  <!-- Speech bubble -->
  <path d="M 30 38
           C 30 32, 35 27, 42 27
           L 86 27
           C 93 27, 98 32, 98 38
           L 98 68
           C 98 74, 93 79, 86 79
           L 55 79
           L 42 93
           L 42 79
           C 35 79, 30 74, 30 68
           Z"
        fill="url(#bubble)" opacity="0.95"/>

  <!-- Three horizontal lines representing comments -->
  <rect x="42" y="39" width="36" height="4" rx="2" fill="#6366F1" opacity="0.5"/>
  <rect x="42" y="49" width="44" height="4" rx="2" fill="#6366F1" opacity="0.5"/>
  <rect x="42" y="59" width="28" height="4" rx="2" fill="#6366F1" opacity="0.5"/>

  <!-- Checkmark circle -->
  <circle cx="85" cy="75" r="18" fill="#10B981"/>
  <circle cx="85" cy="75" r="16" fill="#10B981"/>
  <polyline points="76,75 82,81 94,69" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
